name: Purge Deployments & Workflow Runs

on:
  workflow_dispatch:
    inputs:
      keep_latest:
        description: 'Number of recent deployments/runs to preserve (0 = delete all)'
        required: true
        type: choice
        default: '1'
        options:
          - '3'
          - '2'
          - '1'
          - '0'

permissions:
  deployments: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prune older GitHub Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: 'github-pages'
          KEEP_LATEST: ${{ inputs.keep_latest || '1' }}
        run: |
          echo "=========================================================="
          echo "Repository: $REPO"
          echo "1. Cleaning Deployments (preserving latest $KEEP_LATEST)..."
          echo "=========================================================="

          # Fetch deployments for the environment, fallback to all deployments if empty
          DEPLOYMENTS=$(gh api --paginate "repos/$REPO/deployments?environment=$ENVIRONMENT" --jq '.[].id' 2>/dev/null || true)
          if [ -z "$DEPLOYMENTS" ]; then
            DEPLOYMENTS=$(gh api --paginate "repos/$REPO/deployments" --jq '.[].id' 2>/dev/null || true)
          fi

          if [ -n "$DEPLOYMENTS" ]; then
            TOTAL=$(echo "$DEPLOYMENTS" | grep -c -v '^$' || echo 0)
            echo "Total deployments detected: $TOTAL"

            if [ "$KEEP_LATEST" -eq 0 ]; then
              TO_DELETE="$DEPLOYMENTS"
            else
              TO_DELETE=$(echo "$DEPLOYMENTS" | tail -n +$((KEEP_LATEST + 1)))
            fi

            DELETE_COUNT=$(echo "$TO_DELETE" | grep -c -v '^$' || echo 0)
            echo "Deployments to delete: $DELETE_COUNT"

            for id in $TO_DELETE; do
              echo "Deactivating and deleting deployment ID: $id"
              gh api --method POST "repos/$REPO/deployments/$id/statuses" -f state=inactive > /dev/null 2>&1 || true
              gh api --method DELETE "repos/$REPO/deployments/$id" > /dev/null 2>&1 || true
            done
            echo "Deployments cleanup complete."
          else
            echo "No deployments found."
          fi

      - name: Prune older GitHub Actions workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          KEEP_LATEST: ${{ inputs.keep_latest || '1' }}
        run: |
          echo "=========================================================="
          echo "2. Cleaning Workflow Runs (preserving latest $KEEP_LATEST completed runs per workflow)..."
          echo "=========================================================="

          WORKFLOWS=$(gh api "repos/$REPO/actions/workflows" --jq '.workflows[].id' 2>/dev/null || true)

          if [ -z "$WORKFLOWS" ]; then
            echo "No workflows found in repository."
            exit 0
          fi

          for wf_id in $WORKFLOWS; do
            wf_name=$(gh api "repos/$REPO/actions/workflows/$wf_id" --jq '.name' 2>/dev/null || echo "$wf_id")
            echo "--- Processing workflow: $wf_name (ID: $wf_id) ---"

            # Fetch completed run IDs (newest first)
            RUN_IDS=$(gh api --paginate "repos/$REPO/actions/workflows/$wf_id/runs?status=completed&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null || true)

            if [ -z "$RUN_IDS" ]; then
              echo "No completed runs found for $wf_name."
              continue
            fi

            TOTAL_RUNS=$(echo "$RUN_IDS" | grep -c -v '^$' || echo 0)
            echo "Completed runs detected: $TOTAL_RUNS"

            if [ "$KEEP_LATEST" -eq 0 ]; then
              TO_DELETE="$RUN_IDS"
            else
              TO_DELETE=$(echo "$RUN_IDS" | tail -n +$((KEEP_LATEST + 1)))
            fi

            DELETE_RUNS_COUNT=$(echo "$TO_DELETE" | grep -c -v '^$' || echo 0)
            echo "Runs to delete for $wf_name: $DELETE_RUNS_COUNT"

            for run_id in $TO_DELETE; do
              # Safety: Never delete the currently active workflow run
              if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
                echo "Skipping current active cleanup run ($run_id)."
                continue
              fi

              echo "Deleting workflow run ID: $run_id"
              gh api --method DELETE "repos/$REPO/actions/runs/$run_id" > /dev/null 2>&1 || true
            done
          done

          echo "=========================================================="
          echo "All cleanups complete!"
          echo "=========================================================="
